[workspace]
resolver = "3"
members = ["crates/hopper-core", "crates/hopper"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ptMuta/hopper"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "json", "gzip"] }
async-trait = "0.1"
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
